# GRUB 配置文件 — 同时用于 BIOS 和 UEFI 启动。
# multiboot 命令在两种平台下都受支持：BIOS 经 VBE 设置视频模式，
# UEFI 经 GOP (Graphics Output Protocol) 设置。GRUB EFI 在跳转到
# 内核前会退出 Boot Services 并切换到 32 位保护模式。
set timeout=0
set default=0

# 强制加载所有视频驱动（BIOS VBE / UEFI GOP 都需此模块，否则 GRUB 拿不到
# 任何模式、kernel 只能靠 PCI BAR fallback；UEFI 下没 insmod 时 GRUB 直接
# 报"no suitable video mode"且不填 multiboot fb 字段）。
insmod all_video
terminal_output gfxterm

# gfxmode / gfxpayload：BIOS 和 UEFI 都强制 1024x768x32。
#   UEFI (OVMF/virtio-vga)：
#     - 强制 1024x768x32：让 GRUB EFI 切 GOP 到这个模式（避免 OVMF 默认
#       模式与 QEMU GTK 窗口尺寸不一致时"右半部分黑屏 + 右上有 OVMF logo
#       残留"）。GRUB 设好模式后，QEMU GTK 窗口 (-display gtk,zoom-to-fit=off)
#       自动按帧缓冲 1:1 显示，所以窗口就是 1024x768，无需 window-size 参数
#       （老版本 QEMU 不支持该参数）。三方（GRUB 报告 / kernel 写入 / QEMU
#       显示）都对齐到 1024x768。
#   BIOS (SeaBIOS + QEMU stdvga，默认 -vga std = Bochs VBE)：
#     - 强制 1024x768x32 作为 gfxpayload 提示；若 GRUB 因故回落到文本控制台
#       (w=80 h=25 type=2，本机 QEMU 实测会发生)，kernel 走 PCI BAR fallback
#       拿到 stdvga LFB 后，**会自己用 Bochs VBE DISPI 接口（0x1CE/0x1CF）把
#       VGA 从保护模式直接切到 1024x768x32 线性帧缓冲模式**（drivers/vgavbe.c），
#       不再依赖 GRUB 是否真切成功。NOCACHE 映射 + 选最大 BAR 仍保留。
#     - 之前用 auto 会让 QEMU 选到更大的 VBE 模式 → 窗口"更高更宽"，故显式锁定。
if [ "${grub_platform}" = "efi" ]; then
    set gfxmode=1024x768x32
    set gfxpayload=1024x768x32
else
    set gfxmode=1024x768x32
    set gfxpayload=1024x768x32
fi

menuentry "SproutOS" {
    # 透传 platform (BIOS/UEFI) 和当前 gfxmode (作 fallback hint)。
    # kernel 侧的 g_is_uefi 分支用 platform 走 GRUB VBE / PCI BAR fallback。
    multiboot /boot/kernel.bin platform=${grub_platform} gfx=${gfxmode}
    boot
}
