<!DOCTYPE html>
<html>
<head>
  <title>SproutOS 浏览器 - 主页</title>
</head>
<body style="background-color:#F2F6FF; color:#1A1A1A;">
  <center>
    <h1 style="color:#3A7AFE;">SproutOS 浏览器</h1>
    <p style="font-size:14px; color:#555555;">Phase 1 本地主页 · 选择一个搜索引擎（联网后可用）</p>
  </center>

  <div style="margin:24px; background-color:#FFFFFF; font-weight:bold; font-size:18px; color:#3A7AFE;">
    搜索引擎选择
  </div>

  <div style="margin:24px;">
    <a href="engine:0"><div style="background-color:#FFFFFF; margin:8px; padding:10px; font-size:16px;">百度（国内中文首选）</div></a>
    <a href="engine:1"><div style="background-color:#FFFFFF; margin:8px; padding:10px; font-size:16px;">必应 Bing（中英双语）</div></a>
    <a href="engine:2"><div style="background-color:#FFFFFF; margin:8px; padding:10px; font-size:16px;">谷歌 Google（海外检索）</div></a>
    <a href="engine:3"><div style="background-color:#FFFFFF; margin:8px; padding:10px; font-size:16px;">搜狗（中文资讯）</div></a>
    <a href="engine:4"><div style="background-color:#FFFFFF; margin:8px; padding:10px; font-size:16px;">360 搜索（安全检索）</div></a>
    <a href="engine:5"><div style="background-color:#FFFFFF; margin:8px; padding:10px; font-size:16px;">DuckDuckGo（无追踪隐私）</div></a>
  </div>

  <fieldset style="margin:24px;">
    <legend style="color:#3A7AFE; font-weight:bold;">使用提示</legend>
    <p style="font-size:14px;">· 地址栏输入 <b>/xxx/xxx.html</b> 可打开本地页面</p>
    <p style="font-size:14px;">· 地址栏输入关键词将使用当前引擎（联网后搜索）</p>
    <p style="font-size:14px;">· 顶部下拉框也可随时切换默认引擎</p>
    <p style="font-size:14px;">· 点击超链接可在本地页面间跳转</p>
  </fieldset>

  <blockquote style="margin:24px; color:#444444; font-size:14px;">
    本页为本地内置主页，所有网络功能将在 Phase 2 / Phase 3 启用。
  </blockquote>

  <center><small style="color:#888888;">SproutOS · NewEra Studio</small></center>
</body>
</html>
